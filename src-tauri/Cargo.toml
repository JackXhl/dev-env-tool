[package]
name = "dev-env-tool"
version = "0.1.0"
description = "项目环境探查"
authors = ["JackXhl"]
edition = "2021"

[lib]
name = "dev_env_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
winreg = "0.52"
